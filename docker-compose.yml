# ClipNote — Docker Compose（国际版，官方镜像源）
services:
  server:
    build:
      context: ./server
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine3.22}
    environment:
      API_KEY: ${API_KEY:?API_KEY is required - set it in .env}
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - clipnote-data:/data
    restart: unless-stopped

  # 构建前端静态文件并写入共享 volume，完成后即退出（非常驻）
  web:
    build:
      context: ./web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine3.22}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.20}
    volumes:
      - web-dist:/out
    restart: "no"

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    ports:
      - "${CLIPNOTE_PORT:-31291}:80"
    volumes:
      - web-dist:/srv/www:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  clipnote-data:
  web-dist:
  caddy-data:
  caddy-config:
