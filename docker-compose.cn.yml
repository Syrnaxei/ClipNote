# ClipNote — Docker Compose（中国大陆专用版）
#
# 与 docker-compose.yml 的差异：
#   1. 基础镜像走国内可用的 Docker 镜像加速（DaoCloud 公共源，可按需替换）
#   2. npm 依赖走 npmmirror（淘宝源）
#
# 注：better-sqlite3 v13 起为 N-API 预编译二进制随 npm 包分发，构建全程只走
# npm registry，无 GitHub/编译工具链依赖，中国网络环境下可直接构建。
#
# 使用：docker compose -f docker-compose.cn.yml up -d --build

services:
  server:
    build:
      context: ./server
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine3.22}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      API_KEY: ${API_KEY:?API_KEY is required - set it in .env}
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - clipnote-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine3.22}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-docker.m.daocloud.io/library/alpine:3.20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    volumes:
      - web-dist:/out
    restart: "no"

  caddy:
    image: ${CADDY_IMAGE:-docker.m.daocloud.io/library/caddy:2-alpine}
    ports:
      - "${CLIPNOTE_PORT:-31291}:80"
    volumes:
      - web-dist:/srv/www:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  clipnote-data:
  web-dist:
  caddy-data:
  caddy-config:
