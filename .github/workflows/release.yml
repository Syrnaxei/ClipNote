name: Release

# 推送 v* 标签时：以仓库根目录为构建上下文，buildx 多架构构建
# 并推送 GHCR，同时创建 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史 + tag，供 changelog 取上一 tag 区间
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify lockfiles in sync
        # npm ci 遇到 package.json 与 lockfile 不同步会直接失败，
        # 在构建前暴露依赖清单与 lockfile 漂移（dry-run 不写 node_modules）
        run: |
          npm ci --dry-run --ignore-scripts --prefix web
          npm ci --dry-run --ignore-scripts --prefix server

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --prefix web
          npm ci --ignore-scripts --prefix server

      - name: Test and typecheck
        # 发布门禁：任何一项失败则中止，坏代码不得构建成 latest 镜像
        run: |
          (cd web && npm test && npx tsc -b)
          npm run typecheck --prefix server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build changelog from commits
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          echo "changelog range: $range"
          body=$(mktemp)
          {
            echo "## What's Changed"
            echo
            emit() {
              local label="$1" pattern="$2" lines
              lines=$(git log --no-merges --pretty=format:'- %s (%h)' "$range" \
                | grep -E -- "^- (${pattern})" || true)
              if [ -n "$lines" ]; then
                echo "### ${label}"
                echo
                echo "$lines"
                echo
              fi
            }
            emit '新增' 'feat'
            emit '修复' 'fix'
            emit '性能' 'perf'
            emit '重构' 'refactor'
            emit '文档' 'docs'
            emit '测试' 'test'
            emit '其他' 'chore|ci|build|style'
            # 未按 conventional commits 命名的提交兜底
            lines=$(git log --no-merges --pretty=format:'- %s (%h)' "$range" \
              | grep -Ev -- '^- (feat|fix|perf|refactor|docs|test|chore|ci|build|style)' || true)
            if [ -n "$lines" ]; then
              echo "### 未分类"
              echo
              echo "$lines"
              echo
            fi
          } > "$body"
          {
            echo "body<<CHANGELOG_EOF"
            cat "$body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
